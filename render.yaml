services:
  - type: web
    name: raceanalyst-api
    runtime: python
    repo: https://github.com/RAVIPUJAR/raceanalyst
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: RACE_DATA_ROOT
        value: ./data
      - key: ALLOWED_ORIGINS
        value: https://raceanalyst.com,https://www.raceanalyst.com,https://raceanalyst-api.onrender.com